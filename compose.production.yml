name: campus-foodie

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_NAME: Campus Foodie API
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY 必须显式设置，且不能沿用示例值}
      AUTO_SEED: "false"
      EXPOSE_DEBUG_TOKENS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS 必须列出前端来源}
      USER_WEB_ORIGIN: ${USER_WEB_ORIGIN:?USER_WEB_ORIGIN 必须设置，用于邮件里的回跳链接}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST 必须设置，否则邮箱验证与找回密码会静默失效}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MAIL_FROM: ${MAIL_FROM:-Campus Foodie <no-reply@example.com>}
      UPLOAD_DIR: /app/runtime/uploads
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-8}
    # 仅暴露给同 compose 网络内的反向代理；对外服务请在前面挂 TLS 终止层。
    expose:
      - "8000"
    volumes:
      - uploads:/app/runtime/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

  user-web:
    build:
      context: .
      dockerfile: apps/user-web/Dockerfile
      args:
        VITE_API_MODE: remote
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL}
        VITE_AMAP_KEY: ${AMAP_KEY}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_MODE: remote
        VITE_ADMIN_API_BASE_URL: ${PUBLIC_ADMIN_API_BASE_URL}
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 唯一对外的入口：终止 TLS 并按域名分发。Service Worker 也只有在 HTTPS 下才能注册。
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      USER_WEB_DOMAIN: ${USER_WEB_DOMAIN:?USER_WEB_DOMAIN 必须设置，例如 foodie.example.com}
      ADMIN_WEB_DOMAIN: ${ADMIN_WEB_DOMAIN:?ADMIN_WEB_DOMAIN 必须设置}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN 必须设置}
      ADMIN_ALLOWED_CIDR: ${ADMIN_ALLOWED_CIDR:-0.0.0.0/0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads:
  caddy_data:
  caddy_config:
