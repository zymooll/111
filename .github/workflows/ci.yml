name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campus_foodie_ci
          POSTGRES_USER: campus_foodie
          POSTGRES_PASSWORD: campus_foodie
        options: >-
          --health-cmd "pg_isready -U campus_foodie -d campus_foodie_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev,postgres]'
      - name: Lint backend
        run: python -m ruff check backend/app backend/tests
      - name: Test backend on SQLite
        run: >-
          python -m pytest backend/tests --cov=app --cov-report=term-missing
          --cov-report=xml --cov-fail-under=75
      - name: Test backend on PostgreSQL
        env:
          CI_DATABASE_URL: postgresql+psycopg://campus_foodie:campus_foodie@localhost:5432/campus_foodie_ci
        run: python -m pytest backend/tests
      - name: Static contract audit
        run: python scripts/static_audit.py
      - name: Validate migrations on SQLite
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./runtime/ci.db
          AUTO_SEED: "false"
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Validate migrations on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://campus_foodie:campus_foodie@localhost:5432/campus_foodie_ci
          AUTO_SEED: "false"
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Generate OpenAPI documents
        working-directory: backend
        run: python scripts/export_openapi.py
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -t campus-foodie-api:ci ./backend
          docker build -t campus-foodie-user-web:ci -f apps/user-web/Dockerfile .
          docker build -t campus-foodie-admin-web:ci -f apps/admin-web/Dockerfile .
      - name: Validate production compose interpolation
        env:
          POSTGRES_DB: campus_foodie
          POSTGRES_USER: campus_foodie
          POSTGRES_PASSWORD: ci-only-password
          SECRET_KEY: ci-only-secret-key-with-more-than-32-characters
          CORS_ORIGINS: https://foodie.example.com
          USER_WEB_ORIGIN: https://foodie.example.com
          USER_WEB_DOMAIN: foodie.example.com
          ADMIN_WEB_DOMAIN: admin.example.com
          API_DOMAIN: api.example.com
          SMTP_HOST: smtp.example.com
          PUBLIC_API_BASE_URL: https://api.example.com/api/v1
          PUBLIC_ADMIN_API_BASE_URL: https://api.example.com/admin/api/v1
        run: docker compose -f compose.production.yml config --quiet
      - name: Smoke test the API image
        run: |
          docker run -d --name api-smoke -p 8000:8000 \
            -e ENVIRONMENT=development \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e SECRET_KEY=ci-only-secret-key-with-more-than-32-characters \
            -e AUTO_SEED=true \
            campus-foodie-api:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          echo "API image never became healthy"
          docker logs api-smoke
          exit 1
      - name: Collect API logs on failure
        if: failure()
        run: docker logs api-smoke || true

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: runtime/e2e/
          if-no-files-found: ignore
          retention-days: 7
